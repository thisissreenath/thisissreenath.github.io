<div class="card mb-3">
  <div class="row g-0">
    {% if include.page.image %}
    <div class="col-sm-6 col-md-4">
      <img src="{{ site.baseurl }}/{{ include.page.image }}" alt="{{ include.page.title | escape }}" class="img-fluid rounded-start" style="width: 100%; height: 225px; object-fit: cover;">
    </div>
    {% endif %}
    <div class="{% if include.page.image %}col-sm-6 col-md-8{% else %}col-12{% endif %}">
      <div class="card-body">
        <h5 class="card-title">{{ include.page.title }} <small class="text-muted float-end">{{ include.page.date }}</small></h5>
        <p class="card-text">{{ include.page.summary }}</p>
        <p>
          {% for label in include.page.labels %}
          <span style="background-color: var(--tf-pill-bg)" class="badge rounded-pill">{{ label }}</span>
          {% endfor %}
        </p>
        {% if include.page.projecturl %}
          <a href="{{ include.page.projecturl }}" class="btn btn-outline-dark">Project Site</a>
        {% else %}
          <a href="{{ site.baseurl }}{{ include.page.url }}" class="btn btn-outline-dark">Read More</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
