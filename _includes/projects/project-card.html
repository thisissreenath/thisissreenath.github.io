<article class="card mb-3">
  <div class="card-body p-4">
    <div class="d-flex flex-column flex-md-row justify-content-between gap-2">
      <h3 class="h5 card-title mb-1">{{ include.page.title }}</h3>
      <span class="text-muted">{{ include.page.date }}</span>
    </div>
    <p class="card-text my-2">{{ include.page.summary }}</p>
    <div class="d-flex flex-wrap gap-1 mb-3">
      {% for label in include.page.labels %}
      <span class="badge rounded-pill" style="background-color: var(--tf-pill-bg)">{{ label }}</span>
      {% endfor %}
    </div>
    {% if include.page.projecturl %}
      <a href="{{ include.page.projecturl }}" class="btn btn-outline-dark">Project Site</a>
    {% else %}
      <a href="{{ include.page.url | relative_url }}" class="btn btn-outline-dark">Read More</a>
    {% endif %}
  </div>
</article>
