<div class="col-md-6 col-lg-4">
  <article class="card h-100 shadow-sm">
    {% if include.page.image %}
      <img class="card-img-top" style="height: 190px; object-fit: cover;" loading="lazy" src="{{ include.page.image | relative_url }}" alt="Community engagement: {{ include.page.title | escape }}">
    {% endif %}
    <div class="card-body">
      <h3 class="h5 card-title">{{ include.page.title }}</h3>
      <p class="text-muted small">{{ include.page.date | date: "%B %Y" }}</p>
      <p>{{ include.page.summary | default: include.page.excerpt | strip_html | truncatewords: 35 }}</p>
    </div>
    <div class="card-footer text-center">
      <a href="{{ include.page.url | relative_url }}" class="btn btn-outline-dark">Read Story &amp; View Photos</a>
    </div>
  </article>
</div>
